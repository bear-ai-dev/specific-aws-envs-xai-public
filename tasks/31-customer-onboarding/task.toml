schema_version = "1.4"

[task]
name = "meteringco/customer-onboarding-provisioning"
version = "1.0.0"
description = "Take on a new customer for a business: refuse a caller whose plan is full and an identifier already in use, settle on an identifier, open a contract on the offering signed up to, put a card customer on the business' own connected payment account and hand back the portal link, persist the customer with its opening balance and free trial, meter the onboarding without letting metering take the request down, and announce the new customer."
keywords = ["billing", "onboarding", "provisioning", "stripe-connect", "entitlements", "webhooks", "typescript", "nestjs"]

[[task.authors]]
name = "meteringco-rl-envs"

[metadata]
difficulty = "hard"
category = "billing-lifecycle"
source = "meteringco-codebases"
codebase = "meteringco-backend/top-up-billing-lifecycle"
task_kind = "feature-removal"
tags = [
    "real-codebase",
    "customer-provisioning",
    "entitlement-enforcement",
    "identifier-allocation",
    "payment-rail-onboarding",
    "contract-enrollment",
    "usage-metering",
    "webhook-publication",
    "partial-failure-tolerance",
]

[agent]
user = "agent"
timeout_sec = 14400

[verifier]
user = "root"
timeout_sec = 1800

[environment]
workdir = "/app"
build_timeout_sec = 2400
cpus = 2
memory_mb = 6144
storage_mb = 20480
network_mode = "public"

[environment.env]
TZ = "Etc/UTC"
AWS_ENDPOINT_URL = "http://127.0.0.1:4566"
AWS_ACCESS_KEY_ID = "LOCALMETERINGKEY00"
AWS_SECRET_ACCESS_KEY = "billing-secret"
# The SDK in this tree reads AWS_REGION only. A client built without an
# explicit region has no other source for it inside the container.
AWS_REGION = "us-east-1"
AWS_DEFAULT_REGION = "us-east-1"
# Ordinary service configuration; the repository README lists the same names.
STAGE = "dev"
INFLUX_ORG = "meteringco"
METERINGCO_URL = "http://localhost:3000"
JWT_SECRET = "local-dev-secret"
STRIPE_TOKEN = "sk_test_localonly"
PROD_STRIPE_TOKEN = "sk_live_localonly"

[environment.healthcheck]
command = "test -f /tmp/task-infra/.ready"
interval_sec = 5
timeout_sec = 5
start_period_sec = 30
retries = 12
